name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [24, 26]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm exec -- playwright install --with-deps chromium
            - run: npm run ci:check

    compatibility:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - react: "16.14.0"
                      types: "16"
                    - react: "17"
                      types: "17"
                    - react: "18"
                      types: "18"
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run ci:compatibility -- ${{ matrix.react }} ${{ matrix.types }}
