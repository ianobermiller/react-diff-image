name: Release policy

on:
    pull_request:
        types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
    contents: read

jobs:
    release-policy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - run: node scripts/release-policy.mjs
